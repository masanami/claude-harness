# 一時: TestStaleLockTakeoverIsExclusive を Linux で再現・確認するためのジョブ。PR の最後のコミットで外す。
name: tmp-repro-runstate-lock

on:
  push:
    branches:
      - fix/runstate-stale-lock-empty-owner

permissions:
  contents: read

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        env: [container, runner]
    runs-on: ubuntu-latest
    container: ${{ matrix.env == 'container' && 'golang:1.25-bookworm' || null }}
    defaults:
      run:
        working-directory: runtime
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: matrix.env == 'runner'
        uses: actions/setup-go@v5
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum
      - name: count=50
        if: always()
        run: |
          set +e +o pipefail
          nproc; go version
          go test -v -run TestStaleLockTakeoverIsExclusive -count=50 ./internal/runstate/ > /tmp/plain.log 2>&1; echo "exit=$?"
          echo "fail=$(grep -c -- '--- FAIL' /tmp/plain.log) pass=$(grep -c -- '--- PASS' /tmp/plain.log) debug=$(grep -c 'DEBUG' /tmp/plain.log)"
          echo "conflicts=$(grep -cE 'does not follow|events, want' /tmp/plain.log)"; grep -m 10 -E 'does not follow|events, want' /tmp/plain.log; grep -m 3 'DEBUG stale' /tmp/plain.log
      - name: count=50 under CPU load
        if: always()
        run: |
          set +e +o pipefail
          for i in $(seq 1 $(( $(nproc) * 2 ))); do (while :; do :; done) & done
          go test -v -run TestStaleLockTakeoverIsExclusive -count=50 ./internal/runstate/ > /tmp/load.log 2>&1; echo "exit=$?"
          kill $(jobs -p) 2>/dev/null
          echo "fail=$(grep -c -- '--- FAIL' /tmp/load.log) pass=$(grep -c -- '--- PASS' /tmp/load.log) debug=$(grep -c 'DEBUG' /tmp/load.log)"
          echo "conflicts=$(grep -cE 'does not follow|events, want' /tmp/load.log)"; grep -m 10 -E 'does not follow|events, want' /tmp/load.log; grep -m 3 'DEBUG stale' /tmp/load.log
      - name: count=200 under CPU load
        if: always()
        run: |
          set +e +o pipefail
          for i in $(seq 1 $(( $(nproc) * 2 ))); do (while :; do :; done) & done
          go test -v -run TestStaleLockTakeoverIsExclusive -count=200 ./internal/runstate/ > /tmp/load200.log 2>&1; echo "exit=$?"
          kill $(jobs -p) 2>/dev/null
          echo "fail=$(grep -c -- '--- FAIL' /tmp/load200.log) pass=$(grep -c -- '--- PASS' /tmp/load200.log)"
          echo "conflicts=$(grep -cE 'does not follow|events, want' /tmp/load200.log)"; grep -m 10 -E 'does not follow|events, want' /tmp/load200.log
      - name: count=50 -race
        if: always()
        run: |
          set +e +o pipefail
          go test -v -race -run TestStaleLockTakeoverIsExclusive -count=50 ./internal/runstate/ > /tmp/race.log 2>&1; echo "exit=$?"
          echo "fail=$(grep -c -- '--- FAIL' /tmp/race.log) pass=$(grep -c -- '--- PASS' /tmp/race.log) debug=$(grep -c 'DEBUG' /tmp/race.log)"
          echo "conflicts=$(grep -cE 'does not follow|events, want' /tmp/race.log)"; grep -m 10 -E 'does not follow|events, want' /tmp/race.log; grep -m 3 'DEBUG stale' /tmp/race.log
