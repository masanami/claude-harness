# PR ごとの品質ゲート（make check。docs/harness-runtime-design.md §6.3）。
# 起動は main 宛の PR だけ。ubuntu だけで回す（macOS の分数は 10 倍に数えられるため CI に置かない）。
# macOS での確認は、手元で `make check` を回して行う（README.md「開発」）。
name: check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  make-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum

      # node は skills/demo の mjs を読むテストと、テスト用の stub（jest の代わり）が使う。
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # check-bash のテストが使う外部コマンド: jq（JSON の組み立てと検証）・node（mjs の純粋関数と
      # テスト用の stub）・git・ps。どれかが無いとテストは skip せず失敗する（検査していないものを
      # 通過と報告しない）。ubuntu-latest の既定のイメージに入っていない場合に限って足す。
      - name: Install the tools the bash tests need
        run: |
          missing=""
          for c in jq git ps; do command -v "$c" >/dev/null 2>&1 || missing="$missing $c"; done
          if [ -n "$missing" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq git procps
          fi
          jq --version; git --version; node --version; bash --version | head -1

      - name: Quality gates
        run: |
          grep -E '^Sig(Ign|Blk)' /proc/self/status
          perl -e '$SIG{PIPE} = "DEFAULT"; exec @ARGV or die "exec: $!"' bash -c 'grep -E "^SigIgn" /proc/self/status; make check'

  # 一時: オーナーの確認と同じ golang:1.25-bookworm で 4 本を流して原因を切り分ける（PR を出す前に消す）。
  diag-bookworm:
    runs-on: ubuntu-latest
    container: golang:1.25-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Trace the original worktree-setup.sh main() inside $(...)
        shell: bash {0}
        run: |
          apt-get update -qq >/dev/null && apt-get install -y -qq jq >/dev/null
          git config --global user.email t@example.com; git config --global user.name t
          mkdir -p /tmp/orig/lib
          git show a3630da:plugin/scripts/worktree-setup.sh > /tmp/orig/worktree-setup.sh
          git show a3630da:plugin/scripts/lib/common.sh > /tmp/orig/lib/common.sh
          T=$(mktemp -d); git init -q --bare $T/o.git; git clone -q $T/o.git $T/r 2>/dev/null
          (cd $T/r && echo h > R && git add R && git commit -qm i && git branch -M main && git push -q -u origin main)
          cat > /tmp/drive.sh <<'X'
          set -u
          source /tmp/orig/worktree-setup.sh
          T="$1"
          out="$(cd "$T/r" && PS4='+[$BASH_SUBSHELL] ' && set -x && main 45 feature/issue-45-add-x main "$T/wt" 2> >(grep -E 'trap|release_worktree_lock|rm -rf|exit' >&2))"
          sleep 1
          echo "out=$out"
          ls -la "$T/r/.git/claude-harness-worktree-ops.lock" 2>&1 | head -3
          X
          bash /tmp/drive.sh "$T"
      - name: Run the 4 tests with the fix and node (apt nodejs)
        shell: bash {0}
        run: |
          apt-get update -qq >/dev/null && apt-get install -y -qq jq procps nodejs >/dev/null
          node --version
          for t in mutation-run run-walkthrough-pause-ms worktree-cleanup worktree-setup; do
            echo "##### $t"; bash plugin/scripts/tests/test-$t.sh > /tmp/$t.log 2>&1; echo "exit=$?"
            grep -E 'NG -|expected:|actual:|pass: ' /tmp/$t.log || true
          done
